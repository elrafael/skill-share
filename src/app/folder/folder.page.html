<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ folder }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">{{ folder }}</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <strong class="capitalize">{{ folder }}</strong>
    <p>
      Explore
      <a
        target="_blank"
        rel="noopener noreferrer"
        href="https://ionicframework.com/docs/components"
        >UI Components</a
      >
    </p>

    @if ( photoTaken) {
    <ion-card>
      <ion-card-header>
        <ion-card-title>Photo</ion-card-title>
        <ion-card-subtitle>Photo taken with the camera</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-img [src]="photoTaken" alt="Photo taken with the camera"></ion-img>
      </ion-card-content>
    </ion-card>
    }

    <ion-button
      shape="round"
      fill="outline"
      color="primary"
      (click)="takePhoto()"
    >
      Take a Photo
    </ion-button>
  </div>
</ion-content>
